<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bostoc Plus-tester</title>
<style>
  :root {
    --bg: #f2f2f2;
    --surface: #ffffff;
    --text: #111111;
    --muted: #595959;
    --line: #d0d0d0;
    --accent: #000000;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --surface: #1c1c1c;
      --text: #f0f0f0;
      --muted: #a3a3a3;
      --line: #3a3a3a;
      --accent: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .back, h1, .group { max-width: 720px; margin-left: auto; margin-right: auto; }
  .back {
    display: block;
    margin-bottom: 1rem;
    color: var(--accent);
    text-decoration: none;
    font-size: .9375rem;
  }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1 { font-size: 1.75rem; line-height: 1.25; margin-top: 0; margin-bottom: 1.5rem; }
  .group {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 1rem;
  }
  .group h2 {
    margin: 0;
    padding: 1rem 1.25rem;
    font-size: 1.25rem;
    border-bottom: 1px solid var(--line);
  }
  .group ul { list-style: none; margin: 0; padding: 0; }
  .group li { padding: .625rem 1.25rem; border-bottom: 1px solid var(--line); }
  .group li:last-child { border-bottom: 0; }
</style>
</head>
<body>

<a class="back" href="index.html">← Tillbaka</a>

<h1>Bostoc Plus-tester</h1>

<section class="group">
  <ul>
    <li>Registrera bostad</li>
    <li>Sök bostad</li>
  </ul>
</section>

</body>
</html>
